name: release-console
# Web console (Section 10.6, M13): the manager flavor built for the web and served by Nginx under
# /console (Section 17). Tag `console-v<x.y.z>` → build → GitHub Release asset → optional deploy.
on:
  push: { tags: ['console-v*'] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    # job level: a step's own env is not visible to its `if:`
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version-file: client/pubspec.yaml }
      # Public, non-secret build values only (Section 11): the Supabase publishable key, the web
      # OAuth client id and the Firebase web options. Never the service-role key.
      - name: Write env/prod.json
        env:
          CONSOLE_ENV_JSON: ${{ secrets.CONSOLE_ENV_JSON }}
        run: |
          if [ -z "$CONSOLE_ENV_JSON" ]; then echo "CONSOLE_ENV_JSON secret missing" >&2; exit 1; fi
          printf '%s' "$CONSOLE_ENV_JSON" > env/prod.json
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/manager
      - run: flutter build web --release -t lib/main_manager.dart --dart-define-from-file=env/prod.json --base-href /console/
      - name: Package
        run: |
          rm -f env/prod.json
          tar -C build/web -czf "$GITHUB_WORKSPACE/iccms-console-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/iccms-console-${GITHUB_REF_NAME}.tar.gz"
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/console-v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/iccms-console-${GITHUB_REF_NAME}.tar.gz" --title "Console $GITHUB_REF_NAME" --notes "Web console build (manager flavor)."
      # Deploy to the EC2 host (M14): only when the deploy secrets exist. Unpacks into a new
      # release folder, then switches the /console symlink so Nginx never serves a half copy.
      - name: Deploy
        if: startsWith(github.ref, 'refs/tags/console-v') && env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/deploy_key && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          f="iccms-console-${GITHUB_REF_NAME}.tar.gz"
          scp -i ~/deploy_key -o StrictHostKeyChecking=accept-new "$GITHUB_WORKSPACE/$f" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$f"
          ssh -i ~/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "set -e; d=/opt/iccms/console-releases/$GITHUB_REF_NAME; mkdir -p \$d; tar -xzf /tmp/$f -C \$d; ln -sfn \$d /opt/iccms/console; rm /tmp/$f"
          rm -f ~/deploy_key
