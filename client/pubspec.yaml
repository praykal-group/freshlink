name: iccms
description: "I-CCMS mobile apps (driver, operator, control tower) and web console."
publish_to: 'none'
# Not used for releases: scripts/build_apk.sh passes --build-name/--build-number from release/versions.json.
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: 3.44.0

# Section 10.1 stack, exact versions (resolved against Flutter 3.44.0, which pins meta 1.18.0 and
# intl 0.20.2). Packages for later screens (camera, NFC, maps, printing, ...) are added with the
# milestone that uses them (M11–M13).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # auth
  supabase_flutter: 2.18.3
  google_sign_in: 7.2.0
  # state + navigation
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  # network + realtime
  dio: 5.11.1
  socket_io_client: 3.1.6
  connectivity_plus: 7.3.2
  # storage (drift on SQLCipher, see hooks below)
  drift: 2.35.4
  sqlite3: 3.5.2 # 3.6+ needs meta ^1.19
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  # push + crash reporting
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  firebase_crashlytics: 6.0.1
  flutter_local_notifications: 22.3.3 # 23.x compiles against Android SDK 37 (not installed; D-122)
  # platform info
  package_info_plus: 10.2.2
  device_info_plus: 13.3.0
  # utils
  crypto: 3.0.8
  uuid: 4.6.0
  intl: 0.20.2
  animations: 3.0.0
  # operator app (M11). permission_handler is not used: every 14.x Android part needs SDK 37 (D-129);
  # camera, scanner, speech and the printer plugin request their own permissions.
  camera: 0.12.2
  mobile_scanner: 7.5.0
  nfc_manager: 4.3.0
  flutter_image_compress: 2.5.1
  speech_to_text: 7.5.0
  print_bluetooth_thermal: 1.2.5
  esc_pos_utils_plus: 2.0.4
  share_plus: 13.3.1
  qr: 4.0.0 # 4.0.1 needs Dart 3.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1 # 2.16.2+ needs an analyzer that needs meta ^1.18.3
  drift_dev: 2.35.3
  mocktail: 1.0.5
  fake_async: 1.3.3

# Encrypted local database (Section 10.2 core/storage): package:sqlite3 bundles the SQLCipher
# community build instead of plain SQLite (D-118).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Bundled, OFL (assets/fonts/OFL-*.txt). Poppins covers Latin + Devanagari headings;
    # Noto Sans + Noto Sans Devanagari are variable fonts (weight via FontVariation).
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
