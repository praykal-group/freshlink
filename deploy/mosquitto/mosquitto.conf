# I-CCMS Mosquitto (Section 9.3). Every client authenticates; the ACL limits each device to its own topic.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Dev: plain MQTT on 1883.
listener 1883

# Production (M14): TLS only on 8883. Certificates from certbot, mounted read-only.
# listener 8883
# protocol mqtt
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
# tls_version tlsv1.2
